name: closet

services:
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: ${POSTGRES_DB:-closet}
      PGUSER: closet_app
      PGPASSWORD: ${DB_APP_PASSWORD:?Configure DB_APP_PASSWORD}
      APP_URL: ${APP_URL:?Configure APP_URL}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: closet-private
      S3_ACCESS_KEY_ID: closet-web
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD:?Configure MINIO_APP_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      closet_internal:
      caddy_shared:
        aliases: [closet-web]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-closet}
      POSTGRES_USER: closet_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - closet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U closet_owner -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [closet_internal]

  migrate:
    build:
      context: .
      target: migration
    restart: 'no'
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-closet}
      PGUSER: closet_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Configure DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [closet_internal]

  storage:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: closet_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD}
    volumes:
      - closet_objects:/data
    networks: [closet_internal]

  backup-tools:
    image: alpine:3.23
    profiles: [maintenance]
    network_mode: none
    volumes:
      - closet_objects:/data

  storage-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: 'no'
    entrypoint: ['/bin/sh', '/bootstrap/init.sh']
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configure MINIO_ROOT_PASSWORD}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Configure MINIO_APP_PASSWORD}
    volumes:
      - ./infra/minio:/bootstrap:ro
    depends_on:
      storage:
        condition: service_started
    networks: [closet_internal]

volumes:
  closet_pgdata:
  closet_objects:

networks:
  closet_internal:
    internal: true
  caddy_shared:
    external: true
    name: ${CADDY_NETWORK:-caddy_shared}
